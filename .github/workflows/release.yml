name: Auto Release App

on:
  push:
    branches: [ main ]
    paths: [ 'release/app-release.apk' ]
  # Manual "Run workflow" button on the Actions page
  workflow_dispatch:

permissions:
  contents: write

# Only one release run at a time; a second one waits instead of racing
concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Read version from APK
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2
          BADGING=$("$AAPT2" dump badging release/app-release.apk | head -n 1)
          echo "$BADGING"

          NEW_VCODE=$(echo "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")
          NEW_VNAME=$(echo "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")

          if ! [[ "$NEW_VCODE" =~ ^[0-9]+$ ]] || [ -z "$NEW_VNAME" ]; then
            echo "::error::Could not read versionCode/versionName from the APK"
            exit 1
          fi

          CURRENT_VCODE=$(jq -r '.versionCode' version.json)
          if [ "$NEW_VCODE" -le "$CURRENT_VCODE" ]; then
            echo "::error::APK versionCode $NEW_VCODE must be greater than the published versionCode $CURRENT_VCODE"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$NEW_VNAME" > /dev/null; then
            echo "::error::Tag v$NEW_VNAME already exists; bump versionName in the app before releasing"
            exit 1
          fi

          echo "NEW_VCODE=$NEW_VCODE" >> $GITHUB_ENV
          echo "NEW_VNAME=$NEW_VNAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VNAME }}
          name: Release v${{ env.NEW_VNAME }}
          target_commitish: ${{ github.sha }}
          files: release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only publish the new version.json once the APK is downloadable
      - name: Update version.json
        run: |
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ env.NEW_VNAME }}/app-release.apk"
          jq -n \
            --argjson code "${{ env.NEW_VCODE }}" \
            --arg name "${{ env.NEW_VNAME }}" \
            --arg url "$DOWNLOAD_URL" \
            '{versionCode: $code, versionName: $name, url: $url}' > version.json

      - name: Commit version.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update to versionCode ${{ env.NEW_VCODE }} and versionName ${{ env.NEW_VNAME }}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
