name: Auto Release App

on:
  push:
    branches: [ main ]
    paths: [ 'release/app-release.apk' ]

permissions:
  contents: write

# Only one release run at a time; a second one waits instead of racing
concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Bump version, commit and push
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          bump_version() {
            CURRENT_VCODE=$(jq -r '.versionCode // 0' version.json 2>/dev/null || echo 0)
            CURRENT_VNAME=$(jq -r '.versionName // "1.0"' version.json 2>/dev/null || echo "1.0")

            if ! [[ "$CURRENT_VCODE" =~ ^[0-9]+$ ]]; then
              CURRENT_VCODE=0
            fi
            NEW_VCODE=$((CURRENT_VCODE + 1))

            # Keep only numeric parts (fixes values like "25..1" or "25.")
            IFS='.' read -r -a raw <<< "$CURRENT_VNAME"
            parts=()
            for p in "${raw[@]}"; do
              if [[ "$p" =~ ^[0-9]+$ ]]; then parts+=("$p"); fi
            done
            if [ ${#parts[@]} -eq 0 ]; then parts=(1 0); fi
            if [ ${#parts[@]} -eq 1 ]; then parts+=(0); fi

            last=$((${#parts[@]} - 1))
            parts[$last]=$((parts[$last] + 1))
            NEW_VNAME=$(IFS='.'; echo "${parts[*]}")

            # Never reuse an existing tag
            while git rev-parse -q --verify "refs/tags/v$NEW_VNAME" >/dev/null; do
              parts[$last]=$((parts[$last] + 1))
              NEW_VNAME=$(IFS='.'; echo "${parts[*]}")
            done
          }

          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="

            # Always start from the newest main, so the push can't be "behind"
            git fetch origin main --tags --force
            git reset --hard origin/main

            bump_version
            echo "Version: $CURRENT_VNAME ($CURRENT_VCODE) -> $NEW_VNAME ($NEW_VCODE)"

            DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${NEW_VNAME}/app-release.apk"
            jq -n \
              --argjson code "$NEW_VCODE" \
              --arg name "$NEW_VNAME" \
              --arg url "$DOWNLOAD_URL" \
              '{versionCode: $code, versionName: $name, url: $url}' > version.json
            cat version.json

            git add version.json
            git commit -m "Auto-update to versionCode ${NEW_VCODE} and versionName ${NEW_VNAME}"

            if git push origin HEAD:main; then
              echo "Pushed successfully"
              echo "NEW_VCODE=$NEW_VCODE" >> "$GITHUB_ENV"
              echo "NEW_VNAME=$NEW_VNAME" >> "$GITHUB_ENV"
              echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Push rejected, main changed. Retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 5 attempts. Check for another workflow that also pushes to main."
          exit 1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VNAME }}
          name: Release v${{ env.NEW_VNAME }}
          target_commitish: ${{ env.RELEASE_SHA }}
          files: release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
