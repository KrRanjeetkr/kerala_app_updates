name: Auto Release App

on:
  push:
    branches: [ main ]
    paths: [ 'release/app-release.apk' ]

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bump Version
        id: versioning
        run: |
          CURRENT_VERSION=$(jq -r '.version' version.json)
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update version.json
        run: |
          DOWNLOAD_URL="https://github.com/KrRanjeetkr/kerala_app_updates/releases/download/v${{ env.NEW_VERSION }}/app-release.apk"
          echo "{\"version\": \"${{ env.NEW_VERSION }}\", \"url\": \"$DOWNLOAD_URL\"}" > version.json

      - name: Commit version.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.json
          git commit -m "Auto-update version to v${{ env.NEW_VERSION }}"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          files: release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
